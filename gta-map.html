<!DOCTYPE html>
<html>
<head>
    <title>GTA SA - Интерактивная карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #map-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .admin-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border: 2px solid #f5d742;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .admin-panel.hidden {
            transform: translateX(150%);
            opacity: 0;
        }
        .admin-btn {
            background: linear-gradient(to bottom, #333, #222);
            color: #f5d742;
            border: 1px solid #f5d742;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            transition: all 0.2s;
        }
        .admin-btn:hover {
            background: linear-gradient(to bottom, #f5d742, #d4b732);
            color: #000;
        }
        .admin-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #333;
        }
        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f5d742;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 2px 2px 4px #000;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border: 2px solid #f5d742;
            border-radius: 5px;
            font-size: 20px;
        }
        #notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #f5d742;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #f5d742;
            z-index: 3000;
            display: none;
        }
        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            color: #f5d742;
            border: 1px solid #f5d742;
            border-radius: 5px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .toggle-panel-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            color: #f5d742;
            border: 1px solid #f5d742;
            border-radius: 4px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .toggle-panel-btn:hover {
            background: #f5d742;
            color: #000;
        }
        .admin-only {
            display: none;
        }
        .admin-mode .admin-only {
            display: flex;
        }
        .layer-controls {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            border: 2px solid #f5d742;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
        }
        .layer-controls h3 {
            margin: 0 0 10px 0;
            color: #f5d742;
            font-size: 16px;
        }
        .layer-control {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .layer-control input {
            margin-right: 8px;
        }
        .drawing-controls {
            position: absolute;
            bottom: 80px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            border: 2px solid #f5d742;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            display: none;
        }
        .admin-mode .drawing-controls {
            display: block;
        }
        .drawing-btn {
            background: #333;
            color: #fff;
            border: 1px solid #f5d742;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 3px;
            cursor: pointer;
        }
        .drawing-btn.active {
            background: #f5d742;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        
        <div class="zoom-controls">
            <div class="zoom-btn" id="zoomInBtn">+</div>
            <div class="zoom-btn" id="zoomOutBtn">-</div>
            <div class="zoom-btn" id="resetZoomBtn">
                <i class="fas fa-expand"></i>
            </div>
        </div>
        <div class="layer-controls">
            <h3><i class="fas fa-layer-group"></i> Слои карты</h3>
            <div class="layer-control">
                <input type="checkbox" id="detailsLayer" checked>
                <label for="detailsLayer">Детали</label>
            </div>
            <div class="layer-control">
                <input type="checkbox" id="crystalsLayer" checked>
                <label for="crystalsLayer">Кристаллы</label>
            </div>
            <div class="layer-control">
                <input type="checkbox" id="accidentsLayer" checked>
                <label for="accidentsLayer">Места аварий</label>
            </div>
            <div class="layer-control">
                <input type="checkbox" id="routesLayer" checked>
                <label for="routesLayer">Маршруты</label>
            </div>
        </div>
        <div class="drawing-controls">
            <h3><i class="fas fa-draw-polygon"></i> Рисование</h3>
            <button class="drawing-btn" id="drawRouteBtn">Маршрут</button>
            <button class="drawing-btn" id="drawAccidentBtn">Авария</button>
            <button class="drawing-btn" id="clearDrawingBtn">Очистить</button>
        </div>
        <div class="toggle-panel-btn" id="togglePanelBtn">
            <i class="fas fa-chevron-left"></i>
        </div>
        <div class="admin-panel" id="adminPanel">
            <div class="admin-btn admin-only" id="addDetailBtn">
                <i class="fas fa-car-battery"></i> Добавить деталь
            </div>
            <div class="admin-btn admin-only" id="addCrystalBtn">
                <i class="fas fa-gem"></i> Добавить кристалл
            </div>
            <div class="admin-btn admin-only" id="addAccidentBtn">
                <i class="fas fa-car-crash"></i> Добавить аварию
            </div>
            <div class="admin-btn" id="adminLoginBtn">
                <i class="fas fa-user-shield"></i> Режим админа
            </div>
            <div class="admin-btn admin-only" id="editCodeBtn">
                <i class="fas fa-code"></i> Экспорт/Импорт
            </div>
        </div>
        <div id="notification"></div>
    </div>

    <!-- Данные маркеров -->
    <script type="application/json" id="markersData">
        {
            "details": [
                {"lat": 500, "lng": 500, "title": "Деталь двигателя", "description": "На крыше здания"},
                {"lat": -200, "lng": 300, "title": "Автозапчасть", "description": "Возле гаража"}
            ],
            "crystals": [
                {"lat": -300, "lng": -400, "title": "Синий кристалл", "description": "Спрятан в подвале"}
            ],
            "accidents": [
                {"lat": 100, "lng": 100, "title": "Авария", "description": "Лобовое столкновение", "type": "head-on"},
                {"lat": -100, "lng": 200, "title": "Авария", "description": "Наезд на пешехода", "type": "pedestrian"}
            ],
            "routes": [
                {
                    "name": "Основной маршрут",
                    "points": [
                        {"lat": -500, "lng": -500},
                        {"lat": -300, "lng": -200},
                        {"lat": 0, "lng": 0},
                        {"lat": 200, "lng": 300}
                    ],
                    "color": "#ff0000"
                }
            ]
        }
    </script>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.2/dist/leaflet.draw.js"></script>
    <script>
        // Конфигурация
        const ADMIN_PASSWORD = btoa("gtasa_admin_123");
        const IMAGE_SIZE = 6000;
        let adminMode = false;
        let panelVisible = true;
        let drawingMode = null;
        let drawnItems = new L.FeatureGroup();

        // Инициализация карты
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 5,
            zoomControl: false,
            attributionControl: false,
            maxBoundsViscosity: 0.7,
            inertia: true,
            inertiaDeceleration: 3000
        });

        // Границы карты
        const southWest = L.latLng(-IMAGE_SIZE/2, -IMAGE_SIZE/2);
        const northEast = L.latLng(IMAGE_SIZE/2, IMAGE_SIZE/2);
        const bounds = L.latLngBounds(southWest, northEast);

        // Изображение карты
        L.imageOverlay('https://i.imgur.com/eUAsQFl.png', bounds, {
            opacity: 0.95,
            interactive: true
        }).addTo(map);

        // Группы маркеров
        const detailMarkers = L.layerGroup().addTo(map);
        const crystalMarkers = L.layerGroup().addTo(map);
        const accidentMarkers = L.layerGroup().addTo(map);
        const routeLayers = L.layerGroup().addTo(map);
        map.addLayer(drawnItems);

        // Иконки маркеров
        const createIcon = (iconClass, color) => L.divIcon({
            html: `<div style="
                background: rgba(0,0,0,0.7);
                border: 2px solid ${color};
                border-radius: 50%;
                width: 28px;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: ${color};
                font-size: 14px;
            "><i class="${iconClass}"></i></div>`,
            className: 'custom-icon',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        const detailIcon = createIcon('fas fa-car-battery', '#00aaff');
        const crystalIcon = createIcon('fas fa-gem', '#aa00ff');
        const accidentIcon = createIcon('fas fa-car-crash', '#ff3300');

        // Уведомления
        function showNotification(message, duration = 3000) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, duration);
        }

        // Управление панелью
        function togglePanel() {
            panelVisible = !panelVisible;
            const panel = document.getElementById('adminPanel');
            const toggleBtn = document.getElementById('togglePanelBtn');
            
            panel.classList.toggle('hidden', !panelVisible);
            toggleBtn.innerHTML = panelVisible ? '<i class="fas fa-chevron-left"></i>' : '<i class="fas fa-chevron-right"></i>';
            toggleBtn.style.right = panelVisible ? '170px' : '20px';
            
            showNotification(panelVisible ? "Панель показана" : "Панель скрыта");
        }

        // Управление масштабированием
        function setupZoomControls() {
            document.getElementById('zoomInBtn').addEventListener('click', () => {
                map.zoomIn();
                showNotification("Приближение: " + map.getZoom());
            });
            
            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                map.zoomOut();
                showNotification("Отдаление: " + map.getZoom());
            });
            
            document.getElementById('resetZoomBtn').addEventListener('click', () => {
                map.fitBounds(bounds);
                showNotification("Вид сброшен");
            });
            
            // Горячие клавиши
            document.addEventListener('keydown', (e) => {
                if (e.key === '+') map.zoomIn();
                if (e.key === '-') map.zoomOut();
                if (e.key === '0') map.fitBounds(bounds);
                if (e.key === 'p') togglePanel();
            });
        }

        // Управление слоями
        function setupLayerControls() {
            document.getElementById('detailsLayer').addEventListener('change', (e) => {
                e.target.checked ? map.addLayer(detailMarkers) : map.removeLayer(detailMarkers);
            });
            
            document.getElementById('crystalsLayer').addEventListener('change', (e) => {
                e.target.checked ? map.addLayer(crystalMarkers) : map.removeLayer(crystalMarkers);
            });
            
            document.getElementById('accidentsLayer').addEventListener('change', (e) => {
                e.target.checked ? map.addLayer(accidentMarkers) : map.removeLayer(accidentMarkers);
            });
            
            document.getElementById('routesLayer').addEventListener('change', (e) => {
                e.target.checked ? map.addLayer(routeLayers) : map.removeLayer(routeLayers);
            });
        }

        // Загрузка маркеров
        function loadMarkers() {
            try {
                const data = JSON.parse(document.getElementById('markersData').textContent);
                
                detailMarkers.clearLayers();
                crystalMarkers.clearLayers();
                accidentMarkers.clearLayers();
                routeLayers.clearLayers();
                
                data.details?.forEach(m => addMarker('detail', m.lat, m.lng, m.title, m.description, false));
                data.crystals?.forEach(m => addMarker('crystal', m.lat, m.lng, m.title, m.description, false));
                data.accidents?.forEach(m => addMarker('accident', m.lat, m.lng, m.title, m.description, false, m.type));
                data.routes?.forEach(r => addRoute(r.points, r.name, r.color));
                
            } catch (e) {
                console.error("Ошибка загрузки маркеров:", e);
                showNotification("Ошибка загрузки маркеров!", 5000);
            }
        }

        // Добавление маркера
        function addMarker(type, lat, lng, title, description, draggable, accidentType = null) {
            let icon, color;
            
            switch(type) {
                case 'detail':
                    icon = detailIcon;
                    color = '#00aaff';
                    break;
                case 'crystal':
                    icon = crystalIcon;
                    color = '#aa00ff';
                    break;
                case 'accident':
                    icon = accidentIcon;
                    color = '#ff3300';
                    break;
            }
            
            const marker = L.marker([lat, lng], {
                icon: icon,
                draggable: draggable && adminMode
            }).addTo(
                type === 'detail' ? detailMarkers : 
                type === 'crystal' ? crystalMarkers : 
                accidentMarkers
            );
            
            let popupContent = `
                <div style="background:#111; border:2px solid ${color}; padding:10px; max-width:250px;">
                    <h4 style="margin:0 0 5px 0; color:${color};">${title}</h4>
                    <p style="margin:0;">${description}</p>
            `;
            
            if (type === 'accident' && accidentType) {
                popupContent += `<p style="margin:5px 0 0 0; font-size:12px; color:#ff9999;">Тип: ${getAccidentTypeName(accidentType)}</p>`;
            }
            
            if (draggable && adminMode) {
                popupContent += '<p style="color:#f5d742; font-size:11px; margin-top:5px;">Перетащите для перемещения</p>';
            }
            
            popupContent += `</div>`;
            
            marker.bindPopup(popupContent);
            
            if (draggable && adminMode) {
                marker.on('dragend', () => showNotification("Маркер перемещен"));
            }
            
            return marker;
        }

        // Добавление маршрута
        function addRoute(points, name = "Маршрут", color = "#ff0000") {
            const polyline = L.polyline(points.map(p => [p.lat, p.lng]), {
                color: color,
                weight: 4,
                opacity: 0.7,
                dashArray: '10, 10'
            }).addTo(routeLayers);
            
            polyline.bindPopup(`
                <div style="background:#111; border:2px solid ${color}; padding:10px; max-width:250px;">
                    <h4 style="margin:0 0 5px 0; color:${color};">${name}</h4>
                    <p style="margin:0;">Точки: ${points.length}</p>
                </div>
            `);
            
            return polyline;
        }

        // Получение названия типа аварии
        function getAccidentTypeName(type) {
            const types = {
                'head-on': 'Лобовое столкновение',
                'pedestrian': 'Наезд на пешехода',
                'rollover': 'Опрокидывание',
                'side-impact': 'Боковое столкновение'
            };
            return types[type] || type;
        }

        // Настройка рисования
        function setupDrawingControls() {
            const drawRouteBtn = document.getElementById('drawRouteBtn');
            const drawAccidentBtn = document.getElementById('drawAccidentBtn');
            const clearDrawingBtn = document.getElementById('clearDrawingBtn');
            
            let drawControl;
            
            function activateDrawing(tool) {
                // Удаляем предыдущий инструмент рисования
                if (drawControl) {
                    map.removeControl(drawControl);
                }
                
                // Очищаем предыдущий режим
                if (drawingMode) {
                    drawingMode.disable();
                }
                
                if (tool === 'route') {
                    drawingMode = new L.Draw.Polyline(map, {
                        shapeOptions: {
                            color: '#ff0000',
                            weight: 4,
                            opacity: 0.7,
                            dashArray: '10, 10'
                        },
                        guidelineDistance: 20,
                        showLength: true,
                        metric: true
                    });
                    drawRouteBtn.classList.add('active');
                    drawAccidentBtn.classList.remove('active');
                    showNotification("Режим рисования маршрута");
                } else if (tool === 'accident') {
                    drawingMode = new L.Draw.Marker(map, {
                        icon: accidentIcon
                    });
                    drawAccidentBtn.classList.add('active');
                    drawRouteBtn.classList.remove('active');
                    showNotification("Режим добавления аварий");
                }
                
                drawingMode.enable();
            }
            
            drawRouteBtn.addEventListener('click', () => {
                if (drawingMode && drawingMode._activeDrawing === 'route') {
                    drawingMode.disable();
                    drawRouteBtn.classList.remove('active');
                    showNotification("Режим рисования выключен");
                } else {
                    activateDrawing('route');
                }
            });
            
            drawAccidentBtn.addEventListener('click', () => {
                if (drawingMode && drawingMode._activeDrawing === 'marker') {
                    drawingMode.disable();
                    drawAccidentBtn.classList.remove('active');
                    showNotification("Режим рисования выключен");
                } else {
                    activateDrawing('accident');
                }
            });
            
            clearDrawingBtn.addEventListener('click', () => {
                drawnItems.clearLayers();
                showNotification("Все рисунки удалены");
            });
            
            // Обработчики событий рисования
            map.on(L.Draw.Event.CREATED, (e) => {
                const layer = e.layer;
                drawnItems.addLayer(layer);
                
                if (e.layerType === 'polyline') {
                    const name = prompt("Название маршрута:", "Новый маршрут");
                    if (name) {
                        const color = prompt("Цвет маршрута (hex):", "#ff0000");
                        layer.setStyle({ color: color });
                        
                        layer.bindPopup(`
                            <div style="background:#111; border:2px solid ${color}; padding:10px; max-width:250px;">
                                <h4 style="margin:0 0 5px 0; color:${color};">${name}</h4>
                                <p style="margin:0;">Длина: ${Math.round(e.layer._bounds._southWest.distanceTo(e.layer._bounds._northEast))} м</p>
                            </div>
                        `);
                        
                        showNotification("Маршрут добавлен!");
                    }
                } else if (e.layerType === 'marker') {
                    const title = prompt("Название аварии:", "Авария");
                    if (title) {
                        const desc = prompt("Описание:", "Дорожно-транспортное происшествие");
                        const type = prompt("Тип (head-on, pedestrian, rollover, side-impact):", "head-on");
                        
                        layer.bindPopup(`
                            <div style="background:#111; border:2px solid #ff3300; padding:10px; max-width:250px;">
                                <h4 style="margin:0 0 5px 0; color:#ff3300;">${title}</h4>
                                <p style="margin:0;">${desc}</p>
                                <p style="margin:5px 0 0 0; font-size:12px; color:#ff9999;">Тип: ${getAccidentTypeName(type)}</p>
                            </div>
                        `);
                        
                        showNotification("Авария добавлена!");
                    }
                }
            });
        }

        // Режим администратора
        function toggleAdminMode() {
            if (!adminMode) {
                let attempts = 3;
                
                const checkPassword = () => {
                    const password = prompt(`Введите пароль администратора (${attempts} попытки):`);
                    if (password === null) return;
                    
                    if (btoa(password) === ADMIN_PASSWORD) {
                        adminMode = true;
                        document.body.classList.add('admin-mode');
                        document.getElementById('adminLoginBtn').innerHTML = '<i class="fas fa-sign-out-alt"></i> Выйти';
                        
                        // Включаем перетаскивание для существующих маркеров
                        detailMarkers.eachLayer(m => m.dragging?.enable());
                        crystalMarkers.eachLayer(m => m.dragging?.enable());
                        accidentMarkers.eachLayer(m => m.dragging?.enable());
                        
                        showNotification("Режим администратора включен");
                    } else if (--attempts > 0) {
                        alert(`Неверный пароль! Осталось попыток: ${attempts}`);
                        checkPassword();
                    } else {
                        alert("Доступ запрещен!");
                    }
                };
                
                checkPassword();
            } else {
                adminMode = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminLoginBtn').innerHTML = '<i class="fas fa-user-shield"></i> Режим админа';
                
                // Отключаем перетаскивание для всех маркеров
                detailMarkers.eachLayer(m => m.dragging?.disable());
                crystalMarkers.eachLayer(m => m.dragging?.disable());
                accidentMarkers.eachLayer(m => m.dragging?.disable());
                
                // Выключаем режим рисования
                if (drawingMode) {
                    drawingMode.disable();
                    document.querySelectorAll('.drawing-btn').forEach(btn => btn.classList.remove('active'));
                }
                
                showNotification("Режим администратора выключен");
            }
        }

        // Инициализация
        function init() {
            map.fitBounds(bounds);
            setupZoomControls();
            setupLayerControls();
            setupDrawingControls();
            loadMarkers();
            
            // Обработчики событий
            document.getElementById('addDetailBtn').addEventListener('click', () => {
                if (!adminMode) return;
                const center = map.getCenter();
                const title = prompt("Название детали:", "Деталь");
                if (title) {
                    const desc = prompt("Описание:", "Автозапчасть");
                    addMarker('detail', center.lat, center.lng, title, desc, true);
                    showNotification("Деталь добавлена!");
                }
            });
            
            document.getElementById('addCrystalBtn').addEventListener('click', () => {
                if (!adminMode) return;
                const center = map.getCenter();
                const title = prompt("Название кристалла:", "Кристалл");
                if (title) {
                    const desc = prompt("Описание:", "Ценный кристалл");
                    addMarker('crystal', center.lat, center.lng, title, desc, true);
                    showNotification("Кристалл добавлен!");
                }
            });
            
            document.getElementById('addAccidentBtn').addEventListener('click', () => {
                if (!adminMode) return;
                const center = map.getCenter();
                const title = prompt("Название аварии:", "Авария");
                if (title) {
                    const desc = prompt("Описание:", "Дорожно-транспортное происшествие");
                    const type = prompt("Тип (head-on, pedestrian, rollover, side-impact):", "head-on");
                    addMarker('accident', center.lat, center.lng, title, desc, true, type);
                    showNotification("Авария добавлена!");
                }
            });
            
            document.getElementById('adminLoginBtn').addEventListener('click', toggleAdminMode);
            
            document.getElementById('editCodeBtn').addEventListener('click', () => {
                if (!adminMode) return;
                const code = `<script type="application/json" id="markersData">\n${JSON.stringify({
                    details: Array.from(detailMarkers.getLayers()).map(m => ({
                        lat: m.getLatLng().lat,
                        lng: m.getLatLng().lng,
                        title: m.getPopup().getContent().match(/<h4[^>]*>([^<]*)<\/h4>/)[1],
                        description: m.getPopup().getContent().match(/<p[^>]*>([^<]*)<\/p>/)[1]
                    })),
                    crystals: Array.from(crystalMarkers.getLayers()).map(m => ({
                        lat: m.getLatLng().lat,
                        lng: m.getLatLng().lng,
                        title: m.getPopup().getContent().match(/<h4[^>]*>([^<]*)<\/h4>/)[1],
                        description: m.getPopup().getContent().match(/<p[^>]*>([^<]*)<\/p>/)[1]
                    })),
                    accidents: Array.from(accidentMarkers.getLayers()).map(m => {
                        const popup = m.getPopup().getContent();
                        return {
                            lat: m.getLatLng().lat,
                            lng: m.getLatLng().lng,
                            title: popup.match(/<h4[^>]*>([^<]*)<\/h4>/)[1],
                            description: popup.match(/<p[^>]*>([^<]*)<\/p>/)[1],
                            type: popup.includes('Тип:') ? 
                                popup.match(/Тип: ([^<]*)/)[1].trim().toLowerCase().replace(/ /g, '-') : 
                                'head-on'
                        };
                    }),
                    routes: Array.from(routeLayers.getLayers()).map(r => {
                        const popup = r.getPopup().getContent();
                        return {
                            name: popup.match(/<h4[^>]*>([^<]*)<\/h4>/)[1],
                            points: r.getLatLngs().map(p => ({ lat: p.lat, lng: p.lng })),
                            color: r.options.color
                        };
                    })
                }, null, 2)}\n<\/script>`;
                prompt("Скопируйте этот код и вставьте в HTML:", code);
            });
            
            // Кнопка скрытия/показа панели
            document.getElementById('togglePanelBtn').addEventListener('click', togglePanel);
        }

        // Запуск приложения
        window.addEventListener('load', init);
    </script>
</body>
</html>
